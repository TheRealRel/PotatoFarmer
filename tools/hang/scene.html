<!DOCTYPE html><html><body style="margin:0;background:#9aa0a6;font:14px sans-serif">
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<div id="labels" style="position:absolute;left:0;top:0"></div>
<script type="module">
// Renders scenes given in Unity space (left-handed): a root mirrored on X turns them into three.js space.

import * as THREE from 'three';
const cache={};
async function itemGroup(src){
 if(!cache[src]){const parts=await (await fetch(src)).json();const tl=new THREE.TextureLoader();const g=new THREE.Group();
  for(const p of parts){const pos=new Float32Array(p.v.flat()),uv=new Float32Array(p.uv.flat());
   for(const s of p.subs){const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));geo.setAttribute('uv',new THREE.BufferAttribute(uv,2));
    geo.setIndex(s.tris.flat().slice().reverse());geo.computeVertexNormals();
    let mat;if(s.tex){const t=await tl.loadAsync('hang/'+s.tex);t.colorSpace=THREE.SRGBColorSpace;t.magFilter=THREE.NearestFilter;mat=new THREE.MeshStandardMaterial({map:t,color:new THREE.Color(...s.color),roughness:0.85,metalness:0,side:THREE.DoubleSide});}

  cache[src]=g;}
 return cache[src].clone();}
async function ptm(src,tex){const b=await (await fetch(src)).arrayBuffer();const dv=new DataView(b);const nv=dv.getInt32(4,true),ni=dv.getInt32(8,true);let o=12;
 const pos=new Float32Array(b.slice(o,o+nv*12));o+=nv*12;const nrm=new Float32Array(b.slice(o,o+nv*12));o+=nv*12;const uv=new Float32Array(b.slice(o,o+nv*8));o+=nv*8;

 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('normal',new THREE.BufferAttribute(nrm,3));g.setAttribute('uv',new THREE.BufferAttribute(uv,2));g.setIndex(idx);
 const t=await new THREE.TextureLoader().loadAsync(tex);t.colorSpace=THREE.SRGBColorSpace;t.magFilter=THREE.NearestFilter;
 return new THREE.Mesh(g,new THREE.MeshStandardMaterial({map:t,roughness:0.85,metalness:0}));}
window.load=async(desc)=>{
 const cols=desc.cols||1,T=desc.tile||800,W=desc.w||T,H=desc.h||T,rows=Math.ceil(desc.tiles.length/cols);
 const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(cols*W,rows*H);r.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(r.domElement);r.setScissorTest(true);

  L+=`<div style="position:absolute;left:${x+6}px;top:${y+4}px;color:#111;font-weight:bold">${tile.label||''}</div>`;}

</script></body></html>
